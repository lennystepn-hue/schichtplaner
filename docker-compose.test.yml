# Isolierte Testinstallation fuer den Pilot-Lasttest.
#
# Eigenes Compose-Projekt (siehe test:stack-Skripte / --project-name),
# eigenes Netzwerk, eigenes Volume, eigene Datenbank "schichtplaner_test" -
# vollstaendig getrennt vom produktiven docker-compose.yml. Es wird nichts
# aus der produktiven .env oder dem produktiven Volume wiederverwendet.
#
# Start ausschliesslich mit explizitem --env-file .env.test, damit niemals
# versehentlich die produktive .env als Variablenquelle dient:
#   docker compose -p schichtplaner-test -f docker-compose.test.yml --env-file .env.test up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schichtplaner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env.test gesetzt sein}
      POSTGRES_DB: schichtplaner_test
    ports:
      # Nur an localhost gebunden - fuer test:load:seed vom Host aus.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schichtplaner -d schichtplaner_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://schichtplaner:${POSTGRES_PASSWORD}@postgres:5432/schichtplaner_test
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgresql://schichtplaner:${POSTGRES_PASSWORD}@postgres:5432/schichtplaner_test
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env.test gesetzt sein}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${APP_URL:?APP_URL muss in .env.test gesetzt sein}
      TZ: Europe/Berlin
    ports:
      - "18080:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "no"

volumes:
  postgres_test_data:
