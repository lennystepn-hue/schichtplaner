# Schichtplaner – lokales, datenschutzfreundliches Setup
# Vor dem Start: .env.production.example nach .env kopieren und alle CHANGE_ME-Werte ersetzen.
# Datenbank ist nur im internen Docker-Netz erreichbar (kein Port nach aussen).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schichtplaner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: schichtplaner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schichtplaner"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Legt beim Start die Datenbanktabellen an bzw. aktualisiert sie, danach beendet es sich.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://schichtplaner:${POSTGRES_PASSWORD}@postgres:5432/schichtplaner
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://schichtplaner:${POSTGRES_PASSWORD}@postgres:5432/schichtplaner
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}
      AUTH_TRUST_HOST: "true"
      # Ohne eigene Adresse leitet die Anmeldung hinter dem Reverse Proxy auf
      # die interne Bindeadresse um (https://0.0.0.0:3000), etwa beim Abmelden.
      AUTH_URL: ${APP_URL:?APP_URL muss in .env gesetzt sein}
      # Dienstplaene, Stempelzeiten und Auswertungen rechnen in Ortszeit.
      TZ: Europe/Berlin
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
